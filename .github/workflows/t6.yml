name: T6 source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows-info-client:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compile narrow Windows WPD client
        shell: cmd
        run: tools\read-only-camera-info\build.cmd
      - name: Offline parser tests only
        shell: cmd
        run: tools\read-only-camera-info\build\t6-camera-info.exe --self-test
      - name: Card preparation fixtures and AddressSanitizer only
        shell: cmd
        run: tools\t6-card-boot\build.cmd test-asan
  host-and-arm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential gcc-arm-none-eabi libnewlib-dev python3-pil python3-numpy
      - name: Host behavioral and malformed-input tests
        run: make -C src -f Makefile.t6 test
      - name: Fetch hash-pinned public T6 fixture
        run: python3 src/tools/fetch_t6_sample.py
      - name: Native worker and retro control regressions
        run: make -C src/tools/t6_worker_test test asan retro retro-asan
      - name: Sanitizers
        run: make -C src -f Makefile.t6 asan
      - name: Freestanding ARM effect build
        run: make -C src -f Makefile.t6 arm
      - name: Experimental packed-YUV contracts and ARM build
        run: make -C src/experimental/yuv_anamorphic test asan arm
      - name: Isolated video observer contracts and ARM build
        run: make -C src/experimental/t6_video_probe test asan arm
      - name: Native synthetic CPU benchmark regressions
        run: make -C src/tools/t6_cpu_bench_test test asan
      - name: Static firmware RAM bound
        run: python3 src/tools/t6_worker_test/build_ram_test.py
      - name: Offline installer enumeration regressions
        run: |
          git init /tmp/t6-mlinstall
          git -C /tmp/t6-mlinstall remote add origin https://github.com/petabyt/mlinstall.git
          git -C /tmp/t6-mlinstall fetch --depth 1 origin 1c78f2639ac8d98b63c296592b6492f6597b84af
          git -C /tmp/t6-mlinstall checkout --detach FETCH_HEAD
          git -C /tmp/t6-mlinstall submodule update --init --depth 1 libs/libpict libs/libwpd
          git -C /tmp/t6-mlinstall/libs/libwpd fetch --depth 1 origin 1b523de4df5fdda15db2ac74ef176c227d668299
          python3 integrations/mlinstall/test_patch.py --source /tmp/t6-mlinstall --sanitize
      - name: Compile experimental 1300D.110 overlay
        run: |
          git init /tmp/t6-ml
          git -C /tmp/t6-ml remote add origin https://github.com/reticulatedpines/magiclantern_simplified.git
          git -C /tmp/t6-ml fetch --depth 1 origin 142472e95054d73640f50789ac0fd66325499d82
          git -C /tmp/t6-ml checkout --detach FETCH_HEAD
          python3 src/tools/t6_worker_test/menu_intent_test.py --ml-source /tmp/t6-ml --sanitize
          python3 src/tools/build-t6.py --ml-source /tmp/t6-ml --output /tmp/t6-camera-experiment
